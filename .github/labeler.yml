# Area labels for pull requests. See docs/agents/pr-labels.md.

area:plugin:
  - changed-files:
      - any-glob-to-any-file:
          - main.lua
          - plugin.json

area:plan:
  - changed-files:
      - any-glob-to-any-file: plan/**

area:data:
  - changed-files:
      - any-glob-to-any-file: data/**

area:tests:
  - changed-files:
      - any-glob-to-any-file: tests/**

area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - GLOSSARY.md
          - UX.md
          - CLAUDE.md

area:tooling:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - scripts/**
          - .luacheckrc
          - stylua.toml
